openapi: "3.0.3"
info:
  title: "BlindBox Community Platform API"
  description: "盲盒社区平台 RESTful API 契约，涵盖用户、藏品、交易、社区、资讯、管理等功能"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080"
    description: "本地开发服务器"
  - url: "https://api.blindbox.example.com"
    description: "生产服务器"

tags:
  - name: "Auth"
    description: "认证相关接口"
  - name: "User"
    description: "用户个人操作"
  - name: "Admin - Users"
    description: "管理员 - 用户管理"
  - name: "Admin - Roles"
    description: "管理员 - 角色与权限管理"
  - name: "Collections"
    description: "藏品管理"
  - name: "Collection Categories"
    description: "藏品分类"
  - name: "Exchange Requests"
    description: "交换请求管理"
  - name: "Trade Orders"
    description: "交易订单管理"
  - name: "Trade Reviews"
    description: "交易评价管理"
  - name: "Posts"
    description: "帖子管理"
  - name: "Comments"
    description: "评论管理"
  - name: "Dynamics"
    description: "动态管理"
  - name: "Favorites"
    description: "收藏"
  - name: "Follows"
    description: "关注"
  - name: "Reports"
    description: "举报管理"
  - name: "Articles"
    description: "资讯管理"
  - name: "Article Categories"
    description: "资讯分类"
  - name: "Announcements"
    description: "公告管理"
  - name: "Classification Labels"
    description: "分类标签管理"
  - name: "System Configs"
    description: "系统配置"
  - name: "Admin - Statistics"
    description: "管理员 - 数据统计"
  - name: "Admin - Review"
    description: "管理员 - 内容审核"

paths:
  # ======================== 认证 Auth ========================
  /api/auth/register:
    post:
      tags: ["Auth"]
      summary: "用户注册"
      operationId: "register"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: "注册成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags: ["Auth"]
      summary: "用户登录"
      operationId: "login"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "登录成功，返回JWT令牌"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/reset-password:
    post:
      tags: ["Auth"]
      summary: "密码找回 / 重置密码请求"
      operationId: "resetPasswordRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["email"]
              properties:
                email:
                  type: string
                  format: email
                  description: "注册邮箱"
      responses:
        '200':
          description: "重置邮件已发送"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ======================== 用户个人操作 ========================
  /api/user/profile:
    get:
      tags: ["User"]
      summary: "获取当前登录用户个人信息"
      operationId: "getMyProfile"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "用户信息"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: ["User"]
      summary: "更新个人信息"
      operationId: "updateMyProfile"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: "更新成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/user/profile/avatar:
    post:
      tags: ["User"]
      summary: "上传头像"
      operationId: "uploadAvatar"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "头像图片文件"
      responses:
        '200':
          description: "头像上传成功，返回新的URL"
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    description: "新头像URL"
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/user/profile/password:
    put:
      tags: ["User"]
      summary: "修改密码"
      operationId: "changePassword"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: "密码修改成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/user/account:
    delete:
      tags: ["User"]
      summary: "注销当前账户"
      operationId: "deleteMyAccount"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "账户已注销"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ======================== 管理员 - 用户管理 ========================
  /api/admin/users:
    get:
      tags: ["Admin - Users"]
      summary: "查看用户列表（分页）"
      operationId: "adminListUsers"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: ["active", "disabled"]
          description: "按状态过滤"
        - name: keyword
          in: query
          schema:
            type: string
          description: "用户名或邮箱模糊搜索"
      responses:
        '200':
          description: "分页用户列表"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{id}:
    get:
      tags: ["Admin - Users"]
      summary: "查看某用户详情"
      operationId: "adminGetUserById"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "用户ID"
      responses:
        '200':
          description: "用户详情"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users/{id}/status:
    put:
      tags: ["Admin - Users"]
      summary: "禁用/启用用户"
      operationId: "adminUpdateUserStatus"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "用户ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["status"]
              properties:
                status:
                  type: string
                  enum: ["active", "disabled"]
                  description: "目标状态"
      responses:
        '200':
          description: "状态更新成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users/{id}/password-reset:
    put:
      tags: ["Admin - Users"]
      summary: "管理员重置用户密码"
      operationId: "adminResetUserPassword"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "用户ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["newPassword"]
              properties:
                newPassword:
                  type: string
                  minLength: 6
                  description: "新密码"
      responses:
        '200':
          description: "密码重置成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ======================== 管理员 - 角色与权限 ========================
  /api/admin/roles:
    get:
      tags: ["Admin - Roles"]
      summary: "获取角色列表"
      operationId: "listRoles"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "角色列表"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDTO'
    post:
      tags: ["Admin - Roles"]
      summary: "创建角色"
      operationId: "createRole"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '201':
          description: "角色已创建"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDTO'
  /api/admin/roles/{id}:
    put:
      tags: ["Admin - Roles"]
      summary: "更新角色"
      operationId: "updateRole"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "角色ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: "角色已更新"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDTO'
    delete:
      tags: ["Admin - Roles"]
      summary: "删除角色"
      operationId: "deleteRole"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "角色ID"
      responses:
        '204':
          description: "删除成功"
  /api/admin/roles/{id}/permissions:
    put:
      tags: ["Admin - Roles"]
      summary: "分配权限给角色"
      operationId: "assignRolePermissions"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "角色ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissionIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: "权限ID列表"
      responses:
        '200':
          description: "权限分配成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDTO'
  /api/admin/permissions:
    get:
      tags: ["Admin - Roles"]
      summary: "获取权限列表"
      operationId: "listPermissions"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "权限列表"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionDTO'
  /api/admin/users/{id}/roles:
    put:
      tags: ["Admin - Users"]
      summary: "分配用户角色"
      operationId: "assignUserRoles"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "用户ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: "角色ID列表"
      responses:
        '200':
          description: "角色分配成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

  # ======================== 藏品管理 ========================
  /api/collections:
    get:
      tags: ["Collections"]
      summary: "查询藏品列表（可搜索/过滤）"
      operationId: "listCollections"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
          description: "查看指定用户的藏品（留空则查看当前用户，管理员可查看所有）"
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: series
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: ["available", "in_exchange", "in_trade", "sold", "locked"]
        - name: keyword
          in: query
          schema:
            type: string
          description: "按名称或描述搜索"
      responses:
        '200':
          description: "藏品分页列表"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
    post:
      tags: ["Collections"]
      summary: "添加藏品"
      operationId: "createCollection"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '201':
          description: "藏品创建成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDTO'
  /api/collections/{id}:
    get:
      tags: ["Collections"]
      summary: "查看藏品详情"
      operationId: "getCollectionById"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "藏品详情"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDTO'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: ["Collections"]
      summary: "编辑藏品信息"
      operationId: "updateCollection"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '200':
          description: "更新成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDTO'
    delete:
      tags: ["Collections"]
      summary: "删除藏品"
      operationId: "deleteCollection"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "删除成功"
  /api/collections/{id}/images:
    post:
      tags: ["Collections"]
      summary: "上传藏品图片"
      operationId: "uploadCollectionImage"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "藏品ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                sortOrder:
                  type: integer
                  default: 0
      responses:
        '201':
          description: "图片上传成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionImageDTO'
  /api/collections/{collectionId}/images/{imageId}:
    delete:
      tags: ["Collections"]
      summary: "删除藏品图片"
      operationId: "deleteCollectionImage"
      security:
        - bearerAuth: []
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "删除成功"

  # ======================== 藏品分类 ========================
  /api/collection-categories:
    get:
      tags: ["Collection Categories"]
      summary: "获取藏品分类树"
      operationId: "listCollectionCategories"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "分类列表（树形结构）"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionCategoryDTO'
    post:
      tags: ["Collection Categories"]
      summary: "创建藏品分类"
      operationId: "createCollectionCategory"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCategoryRequest'
      responses:
        '201':
          description: "创建成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionCategoryDTO'
  /api/collection-categories/{id}:
    put:
      tags: ["Collection Categories"]
      summary: "更新分类"
      operationId: "updateCollectionCategory"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCategoryRequest'
      responses:
        '200':
          description: "更新成功"
    delete:
      tags: ["Collection Categories"]
      summary: "删除分类"
      operationId: "deleteCollectionCategory"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "删除成功"

  # ======================== 交换请求 ========================
  /api/exchange-requests:
    get:
      tags: ["Exchange Requests"]
      summary: "获取交换请求列表（我发起的或匹配我的）"
      operationId: "listExchangeRequests"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: type
          in: query
          schema:
            type: string
            enum: ["sent", "received"]
          description: "sent-我发起的，received-匹配给我的"
      responses:
        '200':
          description: "交换请求分页列表"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRequestPage'
    post:
      tags: ["Exchange Requests"]
      summary: "发布交换请求"
      operationId: "createExchangeRequest"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequestCreate'
      responses:
        '201':
          description: "交换请求创建成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRequestDTO'
  /api/exchange-requests/{id}:
    get:
      tags: ["Exchange Requests"]
      summary: "查看交换请求详情"
      operationId: "getExchangeRequestById"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "详情"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRequestDTO'
  /api/exchange-requests/{id}/accept:
    post:
      tags: ["Exchange Requests"]
      summary: "接受交换请求（匹配用户操作）"
      operationId: "acceptExchangeRequest"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "接受成功"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRequestDTO'
  /api/exchange-requests/{id}/decline:
    post:
      tags: ["Exchange Requests"]
      summary: "拒绝交换请求"
      operationId: "declineExchangeRequest"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "已拒绝"
  /api/exchange-requests/{id}/cancel:
    post:
      tags: ["Exchange Requests"]
      summary: "取消交换请求（发起者操作）"
      operationId: "cancelExchangeRequest"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "已取消"

  # ======================== 交易订单 ========================
  /api/trade-orders:
    get:
      tags: ["Trade Orders"]
      summary: "获取交易订单列表（我买入/卖出的）"
      operationId: "listTradeOrders"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: role
          in: query
          schema:
            type: string
            enum: ["buyer", "seller"]
          description: "以买家/卖家视角查看"
        - name: status
          in: query
          schema:
            type: string
            enum: ["pending", "confirmed", "shipped", "completed", "cancelled", "expired"]
      responses:
        '200':
          description: "订单列表"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeOrderPage'
    post:
      tags: ["Trade Orders"]
      summary: "创建交易订单（购买藏品）"
      operationId: "createTradeOrder"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
