server:
  port: 8080

spring:
  application:
    name: blindbox_community_platform
  datasource:
    url: jdbc:h2:mem:blindbox_community_platform
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: your-256-bit-secret-key-for-jwt-signing-must-be-at-least-32-characters
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs